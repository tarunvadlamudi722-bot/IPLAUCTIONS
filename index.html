 peer.on('connection',c=>{c.on('data',m=>onMsg(c,m));c.on('error',()=>{})});
 peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
 peer.on('error',e=>{if(e.type==='unavailable-id'){if(!resumed&&S.phase==='lobby'&&!Object.keys(conns).length){code=rnd(5);S.code=code;openHostPeer(false)}else setTimeout(()=>openHostPeer(resumed),3000)}else setTimeout(()=>{try{peer.disconnected&&peer.reconnect()}catch(e){}},2000)})}
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wl=w).catch(()=>{})}catch(e){}}
function onMsg(c,m){if(m.t==='join'){conns[m.cid]=c;c.cid=m.cid;const mem=S.members[m.cid]||(S.members[m.cid]={name:m.name,team:null});mem.name=m.name;c.send({t:'init',players:PL});push();return}
 if(!c.cid)return;if(m.t==='ping'){c.send({t:'pong'});return}act(c.cid,m)}
function view(k){const h=k===cid,mem=S.members[k]||{},c=S.cur;
 const left=S.pools.reduce((a,p,i)=>a+(i<S.pi?0:i===S.pi?p.ids.length-S.qi:p.ids.length),0)+(S.reran?0:S.unsold.length);
 const v={code:S.code,phase:S.phase,set:S.set,cur:c,paused:S.paused,log:S.log.slice(0,40),my:mem.team,left,pn:(S.pools[S.pi]||{}).name||'',
  mem:Object.values(S.members).map(m=>({n:m.name,t:m.team})),teams:{}};
 for(const T in S.teams){const t=S.teams[T];v.teams[T]={oname:t.oname,on:!!t.own&&(t.own===cid||!!(conns[t.own]&&conns[t.own].open)),taken:!!t.own,purse:t.purse,rtm:t.rtm,n:t.n,os:t.os,sq:(h||mem.team===T)?t.sq:null}}
 if(h){v.pools=S.pools;v.pi=S.pi;v.qi=S.qi;v.unsold=S.unsold}return v}
function push(){if(!S)return;try{localStorage.hs=JSON.stringify(S);localStorage.hp=JSON.stringify(PL)}catch(e){}
 for(const k in conns){const c=conns[k];if(c&&c.open)try{c.send({t:'s',now:Date.now(),s:view(k)})}catch(e){}}ui()}
function bcastInit(){for(const k in conns){const c=conns[k];if(c&&c.open)try{c.send({t:'init',players:PL})}catch(e){}}}
function canBuy(T,pr,pid){const t=S.teams[T];return t&&t.purse>=pr&&t.n<S.set.maxSq&&(PL[pid].c==='IN'||t.os<S.set.maxOs)}
const sh=a=>{for(let i=a.length;i>1;i--){const j=Math.random()*i|0;[a[i-1],a[j]]=[a[j],a[i-1]]}return a};
function startAuc(){const ids=PL.map(p=>p.id);const top=[...ids].sort((a,b)=>PL[b].rt-PL[a].rt).slice(0,Math.min(24,ids.length));const rest=ids.filter(i=>!top.includes(i));
 const nm={B:'Batters',W:'Wicketkeepers',A:'All-rounders',L:'Bowlers'};
 S.pools=[{name:'Marquee Set',ids:sh(top)},...['B','W','A','L'].map(r=>({name:nm[r],ids:sh(rest.filter(i=>PL[i].r===r))}))].filter(p=>p.ids.length);
 for(const T in S.teams){S.teams[T].purse=S.set.purse;S.teams[T].rtm=S.set.rtm}
 S.phase='auction';S.pi=0;S.qi=0;nxt()}
function nxt(){while(S.pi<S.pools.length){const p=S.pools[S.pi];if(S.qi<p.ids.length){const id=p.ids[S.qi++];S.cur={pid:id,bid:0,bidder:null,st:'intro',endsAt:Date.now()+4500};return}S.pi++;S.qi=0}
 if(!S.reran&&S.unsold.length){S.reran=true;S.pools.push({name:'Unsold Re-run',ids:sh(S.unsold)});S.unsold=[];return nxt()}
 S.phase='ended';S.cur=null}
function unsold(){const c=S.cur;c.st='unsold';c.next=Date.now()+3500;if(!S.reran)S.unsold.push(c.pid)}
function sell(T,pr,via){const c=S.cur,t=S.teams[T],p=PL[c.pid];t.purse-=pr;t.sq.push({id:c.pid,pr});t.n++;if(p.c!=='IN')t.os++;if(via==='RTM')t.rtm--;
 c.st='sold';c.to=T;c.price=pr;c.via=via||'';c.next=Date.now()+5500;S.log.unshift({id:c.pid,to:T,pr,via:c.via})}
function close(){const c=S.cur;if(!c.bidder){unsold();return}const T=PL[c.pid].p;
 if(T&&T!==c.bidder&&S.teams[T]&&S.teams[T].own&&S.teams[T].rtm>0&&canBuy(T,c.bid,c.pid)){c.st='rtm1';c.rtmT=T;c.endsAt=Date.now()+20000;return}
 sell(c.bidder,c.bid)}
const ACTIVE=['intro','bid','rtm1','rtm2','rtm3'];
function act(k,m){const c=S.cur,mem=S.members[k];if(!mem)return;const H=k===cid,T=mem.team,t=Date.now();
 switch(m.t){
 case'claim':if(S.teams[m.team]&&!S.teams[m.team].own){if(T){S.teams[T].own=null;S.teams[T].oname=''}S.teams[m.team].own=k;S.teams[m.team].oname=mem.name;mem.team=m.team}break;
 case'free':if(T&&S.phase==='lobby'){S.teams[T].own=null;S.teams[T].oname='';mem.team=null}break;
 case'bid':{if(!c||c.st!=='bid'||S.paused||!T||c.bidder===T)break;const amt=c.bidder?c.bid+inc(c.bid):PL[c.pid].b;if(!canBuy(T,amt,c.pid))break;c.bid=amt;c.bidder=T;c.endsAt=t+S.set.timer*1000;break}
 case'rtmuse':if(c&&c.st==='rtm1'&&T===c.rtmT){c.st='rtm2';c.endsAt=t+25000}break;
 case'rtmpass':if(c&&c.st==='rtm1'&&T===c.rtmT)sell(c.bidder,c.bid);break;
 case'raise':if(c&&c.st==='rtm2'&&T===c.bidder){const a=+m.amt;if(a>=c.bid+inc(c.bid)&&S.teams[T].purse>=a){c.raise=a;c.st='rtm3';c.endsAt=t+20000}}break;
 case'accept':if(c&&c.st==='rtm2'&&T===c.bidder)sell(c.rtmT,c.bid,'RTM');break;
 case'match':if(c&&c.st==='rtm3'&&T===c.rtmT&&canBuy(T,c.raise,c.pid))sell(T,c.raise,'RTM');break;
 case'nomatch':if(c&&c.st==='rtm3'&&T===c.rtmT)sell(c.bidder,c.raise);break;
 case'start':if(H&&S.phase==='lobby')startAuc();break;
 case'set':{if(!H)break;const L=LIM[m.k];if(!L)break;if(m.k!=='timer'&&S.phase!=='lobby')break;S.set[m.k]=Math.min(L[1],Math.max(L[0],S.set[m.k]+m.d));
  if(m.k==='timer'&&c&&c.st==='bid'){if(S.paused)c.left=S.set.timer*1000;else c.endsAt=t+S.set.timer*1000}break}
 case'add':if(H&&c&&ACTIVE.includes(c.st)){if(S.paused)c.left+=m.v*1000;else c.endsAt+=m.v*1000}break;
 case'pause':if(H&&S.phase==='auction'&&c){if(!S.paused){S.paused=true;if(ACTIVE.includes(c.st))c.left=Math.max(0,c.endsAt-t)}else{S.paused=false;if(ACTIVE.includes(c.st))c.endsAt=t+c.left;else c.next=t+1500}}break;
 case'hammer':if(H&&c&&c.st==='bid'){S.paused=false;close()}break;
 case'rtmskip':if(H&&c&&c.st.startsWith('rtm'))c.endsAt=t;break;
 case'skip':if(H&&c){S.paused=false;if(ACTIVE.includes(c.st))unsold();else nxt()}break;
 case'skippool':if(H&&S.phase==='auction'){S.paused=false;const p=S.pools[S.pi];if(c&&ACTIVE.includes(c.st)&&!S.reran)S.unsold.push(c.pid);if(p){if(!S.reran)S.unsold.push(...p.ids.slice(S.qi));S.qi=p.ids.length}nxt()}break;
 }push()}
function tick(){if(!isHost||!S||S.phase!=='auction'||S.paused||!S.cur)return;const c=S.cur,t=Date.now();let ch=true;
 if(c.st==='intro'&&t>=c.endsAt){c.st='bid';c.endsAt=t+S.set.timer*1000}
 else if(c.st==='bid'&&t>=c.endsAt)close();
 else if(c.st==='rtm1'&&t>=c.endsAt)sell(c.bidder,c.bid);
 else if(c.st==='rtm2'&&t>=c.endsAt)sell(c.rtmT,c.bid,'RTM');
 else if(c.st==='rtm3'&&t>=c.endsAt)sell(c.bidder,c.raise);
 else if((c.st==='sold'||c.st==='unsold')&&t>=c.next)nxt();
 else ch=false;if(ch)push()}
setInterval(tick,250);setInterval(()=>{if(isHost&&S)push()},2000);

/* ---------- CLIENT ---------- */
function joinRoom(c){code=c;isHost=false;inRoom=true;V=null;openCli();ui()}
function openCli(){try{peer&&peer.destroy()}catch(e){}hc=null;peer=new Peer();peer.on('open',dial);peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});peer.on('error',e=>{if(e.type==='peer-unavailable'&&!V)toast('Room not found yet – retrying…');dialing=0;setTimeout(dial,2000)})}
function dial(){if(isHost||!peer||peer.destroyed||!peer.open)return;if(hc&&hc.open)return;if(Date.now()-dialing<5000)return;dialing=Date.now();
 const c=peer.connect('iplauc-'+code,{reliable:true});c.on('open',()=>{hc=c;lastMsg=Date.now();c.send({t:'join',cid,name:myName})});
 c.on('data',m=>{lastMsg=Date.now();onData(m)});c.on('close',()=>{if(hc===c)hc=null;dialing=0;setNet(false)});c.on('error',()=>{dialing=0})}
function onData(m){if(m.t==='init'){PL=m.players;return}if(m.t==='s'){off=m.now-Date.now();V=m.s;setNet(true);ui()}}
function setNet(ok){if(ok)downSince=0;else if(!downSince)downSince=Date.now()}
function guard(){if(isHost||!inRoom)return;const ok=hc&&hc.open&&Date.now()-lastMsg<7000;if(ok){setNet(true);try{hc.send({t:'ping'})}catch(e){}return}
 setNet(false);if(hc&&hc.open){try{hc.close()}catch(e){}}hc=null;dialing=0;if(!peer||peer.destroyed)openCli();else if(peer.disconnected){try{peer.reconnect()}catch(e){}}else dial()}
setInterval(guard,2500);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(isHost){wake();tick()}else{lastMsg=lastMsg;guard()}}});
window.addEventListener('online',()=>{if(!isHost)guard()});window.addEventListener('focus',()=>{if(!isHost)guard()});
function send(m){if(isHost)act(cid,m);else if(hc&&hc.open)hc.send(m);else toast('Reconnecting… try again in a moment')}

/* ---------- UI ---------- */
const remain=()=>{const c=V&&V.cur;if(!c)return 0;if(V.paused)return Math.max(0,c.left||0);if(!ACTIVE.includes(c.st))return 0;return Math.max(0,c.endsAt-now())};
let lastSec=-1;
setInterval(()=>{const n=$('#net');if(n)n.innerHTML=(!isHost&&downSince&&Date.now()-downSince>2500)?'<span class="pill">Reconnecting…</span>':'';
 const c=V&&V.cur;if(!c)return;const r=remain(),el=$('#tm');if(el){el.textContent=(r/1000).toFixed(1)+'s'}
 const s=Math.ceil(r/1000);if(c.st==='bid'&&!V.paused&&s<=3&&s>0&&s!==lastSec)SND.tick();lastSec=s},200);
function ui(){if(isHost&&S)V=view(cid);const root=$('#app');
 if(!inRoom){root.innerHTML=landing();return}
 if(!V){root.innerHTML=`<div class="w ctr"><div class="hero"><h2>Connecting to room ${esc(code)}…</h2><p class="mt">Keep this page open. It will retry automatically.</p></div><button class="b" onclick="leave()">Cancel</button></div>`;return}
 snd();
 let body='';if(V.phase==='lobby')body=lobby();else body=({a:auctionTab,s:squadTab,t:teamsTab,h:hostTab})[tab]();
 const nav=V.phase==='lobby'?'':`<div class="nav"><button class="${tab==='a'?'on':''}" onclick="tab='a';ui()">Auction</button><button class="${tab==='s'?'on':''}" onclick="tab='s';ui()">My Squad</button><button class="${tab==='t'?'on':''}" onclick="tab='t';ui()">Teams</button>${isHost?`<button class="${tab==='h'?'on':''}" onclick="tab='h';ui()">Host</button>`:''}</div>`;
 root.innerHTML=`<div class="top"><div><b>IPL Auction</b><span class="code" onclick="cp()">${V.code}</span></div><div class="row"><span id="net"></span><button class="ic" onclick="mute()">${muted?'🔇':'🔊'}</button></div></div><div class="w">${body}</div>${nav}`}
function landing(){const hs=localStorage.hs?JSON.parse(localStorage.hs).code:'';
 return `<div class="w"><div class="hero"><h1>IPL Auction</h1><p class="mt">Host a live auction. Share the room code and friends join from their own phones.</p></div>
 <div class="card"><label>Your name</label><input id="nm" value="${esc(myName)}" maxlength="16" placeholder="e.g. Ravi"><button class="b p" onclick="mk(0)">Create room</button>${hs?`<button class="b" onclick="mk(1)">Resume last room (${hs})</button>`:''}</div>
 <div class="card"><label>Room code</label><input id="rc" value="${hashCode}" maxlength="5" style="text-transform:uppercase;letter-spacing:4px" placeholder="ABCDE"><button class="b g" onclick="jn()">Join room</button></div></div>`}
function nameOK(){const n=($('#nm')||{}).value;if(!n||!n.trim()){toast('Enter your name first');return false}myName=n.trim();localStorage.nm=myName;unlock();return true}

function leave(){inRoom=false;V=null;try{peer.destroy()}catch(e){}ui()}
function cp(){const l=location.origin+location.pathname+'#'+V.code;if(navigator.share)navigator.share({title:'IPL Auction',text:'Join my IPL auction – code '+V.code,url:l}).catch(()=>{});else if(navigator.clipboard){navigator.clipboard.writeText(l);toast('Invite link copied')}else prompt('Invite link',l)}
function stp(l,k,v,d,f){return `<div class="stp"><span>${l}</span><div><button class="b s" onclick="send({t:'set',k:'${k}',d:${-d}})">−</button><b>${f(v)}</b><button class="b s" onclick="send({t:'set',k:'${k}',d:${d}})">+</button></div></div>`}
function lobby(){const s=V.set;
 return `<div class="card ctr"><div class="mt">Room code</div><div class="big" style="letter-spacing:6px;color:var(--ac)">${V.code}</div><button class="b" onclick="cp()">Share invite link</button></div>
 <div class="card"><h2>Pick your franchise</h2><div class="grid">${Object.keys(TEAMS).map(T=>{const t=V.teams[T],mine=V.my===T;return `<button class="tc ${mine?'mine':''}" style="border-color:${t.taken?tcol(T):''}" ${t.taken&&!mine?'disabled':''} onclick="send({t:'${mine?'free':'claim'}',team:'${T}'})"><b style="color:${tcol(T)}">${T}</b><small>${t.taken?esc(t.oname)+(t.on?' ●':' (offline)'):'Open · tap to claim'}</small></button>`}).join('')}</div></div>
 <div class="card"><h2>In the room (${V.mem.length})</h2>${V.mem.map(m=>`<div class="li"><span>${esc(m.n)}</span><span style="color:${tcol(m.t)}">${m.t||'spectating'}</span></div>`).join('')}</div>
 ${isHost?`<div class="card"><h2>Rules</h2>${stp('Purse','purse',s.purse,500,v=>fmt(v))}${stp('Bid timer','timer',s.timer,5,v=>v+'s')}${stp('RTM cards','rtm',s.rtm,1,v=>v)}${stp('Max squad','maxSq',s.maxSq,1,v=>v)}${stp('Max overseas','maxOs',s.maxOs,1,v=>v)}<div class="mt" style="font-size:13px">${PL.length} players loaded</div><button class="b" onclick="openImp()">Import players</button></div>
 <button class="b p" onclick="send({t:'start'})">Start auction</button>`:`<div class="card ctr mt">Waiting for the host to start…</div>`}`}

 return `<div class="card"><div class="row sp"><span class="chip">${esc(V.pn)}</span><span class="chip">${V.left} to go</span></div><div class="pn">${esc(P.n)}</div>
 <div class="row wrap mt"><span>${ROLE[P.r]}</span>·<span>${CTRY[P.c]||P.c}</span>${P.c!=='IN'?'<span class="chip os">Overseas</span>':''}</div>
 <div class="prof"><div><i>Base price</i><b>${fmt(P.b)}</b></div><div><i>Rating</i><b>${P.rt}/100</b></div><div><i>Role</i><b>${ROLE[P.r]}</b></div><div><i>Last team · RTM</i><b style="color:${tcol(P.p)}">${P.p||'—'}</b></div></div></div>`}
function bidInfo(){const c=V.cur;if(!c)return{};if(c.st==='intro')return{why:'Get ready…'};if(c.st!=='bid')return{};if(V.paused)return{why:'Paused by host'};const T=V.my;if(!T)return{why:'Claim a team in the Teams tab to bid'};if(c.bidder===T)return{why:'You hold the highest bid'};
 const P=PL[c.pid],amt=c.bidder?c.bid+inc(c.bid):P.b,t=V.teams[T];if(t.purse<amt)return{why:'Not enough purse'};if(t.n>=V.set.maxSq)return{why:'Squad is full'};if(P.c!=='IN'&&t.os>=V.set.maxOs)return{why:'Overseas limit reached'};return{ok:true,amt}}

function bidPanel(){const c=V.cur;if(!c)return '';const P=PL[c.pid];
 if(c.st==='sold')return `<div class="card sold"><div class="big">SOLD</div><div style="font-size:18px;color:${tcol(c.to)}">${tn(c.to)}</div><div class="big" style="font-size:28px">${fmt(c.price)}</div>${c.via?'<div class="chip">via RTM</div>':''}</div>`;
 if(c.st==='unsold')return `<div class="card uns"><div class="big">UNSOLD</div><div class="mt">${esc(P.n)} returns later if there's a re-run</div></div>`;
 let mid='';const me=V.my;
 if(c.st==='rtm1')mid=`<div class="card" style="border-color:var(--am)"><h2 style="color:var(--am)">Right to Match</h2><p>${tn(c.rtmT)} may match ${fmt(c.bid)} (${tn(c.bidder)}'s bid).</p>${me===c.rtmT?`<button class="b g" onclick="send({t:'rtmuse'})">Use RTM at ${fmt(c.bid)}</button><button class="b" onclick="send({t:'rtmpass'})">Let player go</button>`:''}</div>`;
 else if(c.st==='rtm2'){const min=c.bid+inc(c.bid);if(!raise||raise<min)raise=min;mid=`<div class="card" style="border-color:var(--am)"><h2 style="color:var(--am)">${tn(c.rtmT)} used RTM</h2>${me===c.bidder?`<p>Raise to your own final amount, or accept.</p><div class="stp"><div><button class="b s" onclick="adjR(-25)">−25L</button><button class="b s" onclick="adjR(-5)">−5L</button></div><b style="font-size:22px">${fmt(raise)}</b><div><button class="b s" onclick="adjR(5)">+5L</button><button class="b s" onclick="adjR(25)">+25L</button><button class="b s" onclick="adjR(100)">+1Cr</button></div></div><button class="b p" onclick="send({t:'raise',amt:raise});raise=0">Raise to ${fmt(raise)}</button><button class="b" onclick="send({t:'accept'})">Don't raise</button>`:`<p class="mt">${tn(c.bidder)} can raise their bid…</p>`}</div>`}
 else if(c.st==='rtm3')mid=`<div class="card" style="border-color:var(--am)"><h2 style="color:var(--am)">${tn(c.bidder)} raised to ${fmt(c.raise)}</h2>${me===c.rtmT?`<button class="b g" ${V.teams[me].purse<c.raise?'disabled':''} onclick="send({t:'match'})">Match ${fmt(c.raise)}</button><button class="b" onclick="send({t:'nomatch'})">Decline</button>`:`<p class="mt">${tn(c.rtmT)} to match or decline…</p>`}</div>`;
 const bi=bidInfo(),r=remain();
 return `<div class="card ctr"><div class="mt">${c.st==='intro'?'Starting':c.bidder?'Current bid':'No bids yet'}</div><div class="big">${c.bidder?fmt(c.bid):fmt(PL[c.pid].b)}</div>${c.bidder?`<div style="font-size:18px;color:${tcol(c.bidder)}">${tn(c.bidder)}</div>`:''}
 <div class="tm" id="tm" style="margin-bottom:8px">${(r/1000).toFixed(1)}s</div>${V.paused?'<div class="pill">Paused</div>':''}
 ${c.st==='bid'?`<button class="b p" style="font-size:18px;padding:16px" ${bi.ok?'':'disabled'} onclick="send({t:'bid'})">${bi.ok?'BID '+fmt(bi.amt):(bi.why||'Bid')}</button>`:''}</div>${mid}`}

 <div class="row"><button class="b" onclick="if(!V.cur.bidder||confirm('Skip and discard current bids?'))send({t:'skip'})">⏭ Skip player</button><button class="b" onclick="if(confirm('Skip the rest of this pool?'))send({t:'skippool'})">⏩ Skip pool</button></div>
 <div class="stp"><span>Bid timer</span><div><button class="b s" onclick="send({t:'set',k:'timer',d:-5})">−5</button><b>${V.set.timer}s</b><button class="b s" onclick="send({t:'set',k:'timer',d:5})">+5</button></div></div>
 <div class="row"><button class="b" onclick="send({t:'add',v:10})">+10s this lot</button>${c.st.startsWith('rtm')?`<button class="b" onclick="send({t:'rtmskip'})">Skip RTM step</button>`:''}</div></div>`}
function logCard(){if(!V.log.length)return '';return `<div class="card"><h2>Recent sales</h2>${V.log.slice(0,8).map(l=>`<div class="li"><span>${esc(PL[l.id].n)}</span><span style="color:${tcol(l.to)}">${l.to} · ${fmt(l.pr)}${l.via?' · RTM':''}</span></div>`).join('')}</div>`}
function sqHtml(T){const t=V.teams[T];if(!t||!t.sq)return '<p class="mt">Squads of other teams are hidden.</p>';
 const rows=[...t.sq].sort((a,b)=>b.pr-a.pr).map(x=>{const p=PL[x.id];return `<div class="li"><span>${esc(p.n)}<br><small class="mt">${ROLE[p.r]} · ${CTRY[p.c]||p.c}</small></span><b>${fmt(x.pr)}</b></div>`}).join('');
 return `<div class="row wrap" style="margin-bottom:6px"><span class="chip">Purse ${fmt(t.purse)}</span><span class="chip">${t.n}/${V.set.maxSq} players</span><span class="chip">${t.os}/${V.set.maxOs} overseas</span><span class="chip">${t.rtm} RTM</span></div>${rows||'<p class="mt">No players yet.</p>'}`}
function squadTab(){if(!V.my)return `<div class="card ctr mt">You haven't claimed a team. Go to Teams to claim an open franchise.</div>`;return `<div class="card"><h2 style="color:${tcol(V.my)}">${tn(V.my)}</h2>${sqHtml(V.my)}</div>`}
function teamsTab(){return `<div class="card"><h2>Franchises</h2>${Object.keys(TEAMS).map(T=>{const t=V.teams[T],mine=V.my===T;return `<div class="li"><span><b style="color:${tcol(T)}">${T}</b> <small class="mt">${t.taken?esc(t.oname)+(t.on?'':' (offline)'):'open'}</small></span><span class="row"><small class="mt">${fmt(t.purse)} · ${t.n}p · ${t.rtm} RTM</small>${!t.taken&&!V.my?`<button class="b s" onclick="send({t:'claim',team:'${T}'})">Claim</button>`:mine?'<span class="chip">You</span>':''}</span></div>`}).join('')}</div>`}
function hostTab(){const vtm=vt||Object.keys(TEAMS)[0];const p=V.pools||[];
 const up=[];if(p[V.pi])up.push(...p[V.pi].ids.slice(V.qi));
 return `<div class="card"><h2>Up next</h2>${up.slice(0,12).map(i=>`<div class="li"><span>${esc(PL[i].n)}</span><span class="mt">${ROLE[PL[i].r]} · ${PL[i].rt}</span></div>`).join('')||'<p class="mt">Pool finished.</p>'}</div>
 <div class="card"><h2>Pools</h2>${p.map((x,i)=>`<div class="li"><span>${i===V.pi?'▶ ':''}${esc(x.name)}</span><span class="mt">${i<V.pi?0:i===V.pi?x.ids.length-V.qi:x.ids.length} left</span></div>`).join('')}<div class="li"><span>Unsold (re-run at end)</span><span class="mt">${(V.unsold||[]).length}</span></div></div>
 <div class="card"><h2>All squads</h2><select onchange="vt=this.value;ui()">${Object.keys(TEAMS).map(T=>`<option value="${T}" ${T===vtm?'selected':''}>${TEAMS[T][0]}${V.teams[T].taken?' – '+esc(V.teams[T].oname):''}</option>`).join('')}</select>${sqHtml(vtm)}</div>
 <button class="b" onclick="expCsv()">Download results (CSV)</button>`}
function expCsv(){let r='Team,Owner,Player,Country,Role,Price(Lakh)\n';for(const T in V.teams){const t=V.teams[T];(t.sq||[]).forEach(x=>{const p=PL[x.id];r+=[T,t.oname,p.n,p.c,p.r,x.pr].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')+'\n'})}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r],{type:'text/csv'}));a.download='ipl-auction-results.csv';a.click()}
function openImp(){$('#ta').value=localStorage.csv||RAW;$('#imp').showModal()}
function doImp(){const p=parse($('#ta').value);if(p.length<10){toast('Need at least 10 valid lines');return}if(S.phase!=='lobby'){toast('Only before the auction starts');return}PL=p;localStorage.csv=$('#ta').value;$('#imp').close();bcastInit();toast(p.length+' players loaded');push()}
function resetImp(){localStorage.removeItem('csv');if(S&&S.phase==='lobby'){PL=parse(RAW);bcastInit();push()}$('#imp').close()}
ui();
</script></body></html>
